<svg width="700" height="100" viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg">

  <rect width="700" height="100" rx="12" fill="#000205"/>

  <!-- Terminal dots -->
  <circle cx="25" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="59" cy="22" r="5" fill="#27c93f"/>

  <!-- Prompt -->
  <text
    x="25"
    y="65"
    fill="#58a6ff"
    font-family="monospace"
    font-size="21"
    font-weight="bold">
    &gt;
  </text>

  <!-- Animated text -->
  <text
    x="48"
    y="65"
    fill="#ffffff"
    font-family="monospace"
    font-size="20">

    <tspan>Learn → Build → Break → Fix → Repeat.</tspan>

    <animate
      attributeName="opacity"
      values="0;1;1;1;0"
      keyTimes="0;0.05;0.8;0.95;1"
      dur="8s"
      repeatCount="indefinite"/>

  </text>

  <!-- Blinking cursor -->
  <rect
    x="535"
    y="45"
    width="10"
    height="25"
    fill="#ffffff">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      repeatCount="indefinite"/>

  </rect>

</svg>
